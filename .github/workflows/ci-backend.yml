name: Backend CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EvArkadasim.sln

      - name: Build
        run: dotnet build EvArkadasim.sln --configuration Release --no-restore

      - name: Expense validation smoke test
        run: dotnet run --project Tests/ExpenseValidationSmoke/ExpenseValidationSmoke.csproj --configuration Release --no-build

      - name: Build Docker image
        run: docker build --tag roomora-backend:ci .
